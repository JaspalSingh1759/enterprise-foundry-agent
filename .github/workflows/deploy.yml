name: AI Platform CD - Provision & Deploy to Azure

on:
  workflow_dispatch: # Manual trigger for safety in initial stages
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write  # Required for Azure OIDC Workload Identity Federation
  contents: read

env:
  AZURE_ENV_NAME: ${{ inputs.environment || 'dev' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  # Pinned so a new azd or beta extension release can't change the pipeline's behaviour unannounced.
  AZD_VERSION: 1.37.1
  AZD_AGENTS_EXTENSION_VERSION: 1.0.0-beta.22

jobs:
  # =============================================================
  # Stage 1: Deploy MCP Tool Server Tier (Container App)
  # =============================================================
  deploy-mcp-server:
    name: 1. Deploy MCP Server Tier
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      mcp_fqdn: ${{ steps.mcp-deploy.outputs.MCP_FQDN }}
      key_vault_name: ${{ steps.mcp-deploy.outputs.KEY_VAULT_NAME }}
      key_vault_endpoint: ${{ steps.mcp-deploy.outputs.KEY_VAULT_ENDPOINT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Azure Developer CLI (azd)
        uses: Azure/setup-azd@v2
        with:
          version: ${{ env.AZD_VERSION }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Log in to Azure via OIDC (Zero-Secret Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use Azure CLI session
        run: azd config set auth.useAzCliAuth "true"

      - name: Provision & Deploy MCP Server
        id: mcp-deploy
        working-directory: resources-mcp
        run: |
          azd env new $AZURE_ENV_NAME --no-prompt || true
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_TENANT_ID ${{ secrets.AZURE_TENANT_ID }}
          azd up --no-prompt

          # Capture the output FQDN needed for Stage 2
          MCP_FQDN=$(azd env get-value AZURE_RESOURCE_MCP_TODO_FQDN)
          echo "MCP_FQDN=$MCP_FQDN" >> $GITHUB_OUTPUT
          echo "KEY_VAULT_NAME=$(azd env get-value AZURE_KEY_VAULT_NAME)" >> $GITHUB_OUTPUT
          echo "KEY_VAULT_ENDPOINT=$(azd env get-value AZURE_KEY_VAULT_ENDPOINT)" >> $GITHUB_OUTPUT
          echo "Deployed MCP Server at: $MCP_FQDN"

  # =============================================================
  # Stage 2: Deploy AI Foundry & Hosted Agent Tier
  # =============================================================
  deploy-ai-foundry:
    name: 2. Deploy AI Foundry & Agent Tier
    needs: deploy-mcp-server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      foundry_endpoint: ${{ steps.foundry-deploy.outputs.FOUNDRY_ENDPOINT }}
      foundry_resource_group: ${{ steps.foundry-deploy.outputs.FOUNDRY_RESOURCE_GROUP }}
      foundry_name: ${{ steps.foundry-deploy.outputs.FOUNDRY_NAME }}
      foundry_project_name: ${{ steps.foundry-deploy.outputs.FOUNDRY_PROJECT_NAME }}
      foundry_model: ${{ steps.foundry-deploy.outputs.FOUNDRY_MODEL }}
      todo_agent_name: ${{ steps.foundry-deploy.outputs.TODO_AGENT_NAME }}
      todo_agent_version: ${{ steps.foundry-deploy.outputs.TODO_AGENT_VERSION }}
      todo_agent_endpoint: ${{ steps.foundry-deploy.outputs.TODO_AGENT_ENDPOINT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Azure Developer CLI (azd)
        uses: Azure/setup-azd@v2
        with:
          version: ${{ env.AZD_VERSION }}

      - name: Install azd extension for Foundry Agents
        run: azd extension install azure.ai.agents --version $AZD_AGENTS_EXTENSION_VERSION

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use Azure CLI session
        run: azd config set auth.useAzCliAuth "true"

      - name: Provision Foundry & Deploy Hosted Agent
        id: foundry-deploy
        working-directory: resources-foundry
        env:
          AZURE_RESOURCE_MCP_TODO_FQDN: ${{ needs.deploy-mcp-server.outputs.mcp_fqdn }}
        run: |
          azd env new $AZURE_ENV_NAME --no-prompt || true
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_TENANT_ID ${{ secrets.AZURE_TENANT_ID }}
          azd env set AZURE_RESOURCE_MCP_TODO_FQDN $AZURE_RESOURCE_MCP_TODO_FQDN
          azd env set AZURE_KEY_VAULT_NAME "${{ needs.deploy-mcp-server.outputs.key_vault_name }}"
          azd env set AZURE_KEY_VAULT_ENDPOINT "${{ needs.deploy-mcp-server.outputs.key_vault_endpoint }}"
          # Provision infrastructure first to ensure Bicep outputs are exported to azd environment
          azd provision --no-prompt --no-state

          # Ensure FOUNDRY_PROJECT_ENDPOINT is set in azd environment for azure.ai.agents extension
          FOUNDRY_ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT || azd env get-value FOUNDRY_PROJECT_ENDPOINT)
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_ENDPOINT"

          # Deploy the Hosted Agent
          azd deploy --no-prompt

          FOUNDRY_ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT || azd env get-value FOUNDRY_PROJECT_ENDPOINT)
          FOUNDRY_RESOURCE_GROUP="rg-$(azd env get-value AZURE_ENV_NAME)"
          FOUNDRY_NAME=$(azd env get-value AZURE_AI_ACCOUNT_NAME || azd env get-value FOUNDRY_NAME)
          FOUNDRY_PROJECT_NAME=$(azd env get-value AZURE_AI_PROJECT_NAME || azd env get-value FOUNDRY_PROJECT_NAME)
          FOUNDRY_MODEL=$(azd env get-value AZURE_AI_MODEL_DEPLOYMENT_NAME)
          TODO_AGENT_NAME=$(azd env get-value AGENT_TODO_AGENT_NAME || echo "todo-agent")
          TODO_AGENT_VERSION=$(azd env get-value AGENT_TODO_AGENT_VERSION || echo "")
          TODO_AGENT_ENDPOINT=$(azd env get-value AGENT_TODO_AGENT_ENDPOINT || echo "")

          echo "FOUNDRY_ENDPOINT=$FOUNDRY_ENDPOINT" >> $GITHUB_OUTPUT
          echo "FOUNDRY_RESOURCE_GROUP=$FOUNDRY_RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "FOUNDRY_NAME=$FOUNDRY_NAME" >> $GITHUB_OUTPUT
          echo "FOUNDRY_PROJECT_NAME=$FOUNDRY_PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "FOUNDRY_MODEL=$FOUNDRY_MODEL" >> $GITHUB_OUTPUT
          echo "TODO_AGENT_NAME=$TODO_AGENT_NAME" >> $GITHUB_OUTPUT
          echo "TODO_AGENT_VERSION=$TODO_AGENT_VERSION" >> $GITHUB_OUTPUT
          echo "TODO_AGENT_ENDPOINT=$TODO_AGENT_ENDPOINT" >> $GITHUB_OUTPUT
          echo "Deployed AI Project Endpoint at: $FOUNDRY_ENDPOINT"


  # =============================================================
  # Stage 3: Deploy Aspire WebUI & Gateway Apps
  # =============================================================
  deploy-aspire-apps:
    name: 3. Deploy Aspire WebUI & Gateway
    needs: [deploy-mcp-server, deploy-ai-foundry]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Azure Developer CLI (azd)
        uses: Azure/setup-azd@v2
        with:
          version: ${{ env.AZD_VERSION }}

      - name: Setup .NET SDK & Aspire Workload
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Aspire Workload
        run: dotnet workload install aspire

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use Azure CLI session
        run: azd config set auth.useAzCliAuth "true"

      - name: Seed Aspire AppHost Configuration from Foundry
        run: |
          dotnet user-secrets --project src/MafStarterPack.AppHost set "AZURE_TENANT_ID" "${{ secrets.AZURE_TENANT_ID }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "FOUNDRY_RESOURCE_GROUP" "${{ needs.deploy-ai-foundry.outputs.foundry_resource_group }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "FOUNDRY_NAME" "${{ needs.deploy-ai-foundry.outputs.foundry_name }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "FOUNDRY_PROJECT_NAME" "${{ needs.deploy-ai-foundry.outputs.foundry_project_name }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "FOUNDRY_PROJECT_ENDPOINT" "${{ needs.deploy-ai-foundry.outputs.foundry_endpoint }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "FOUNDRY_MODEL_DEPLOYMENT_NAME" "${{ needs.deploy-ai-foundry.outputs.foundry_model }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "TODO_AGENT_NAME" "${{ needs.deploy-ai-foundry.outputs.todo_agent_name }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "TODO_AGENT_VERSION" "${{ needs.deploy-ai-foundry.outputs.todo_agent_version }}"
          dotnet user-secrets --project src/MafStarterPack.AppHost set "TODO_AGENT_ENDPOINT" "${{ needs.deploy-ai-foundry.outputs.todo_agent_endpoint }}"

      - name: Deploy Apps via Root azd
        run: |
          azd env new $AZURE_ENV_NAME --no-prompt || true
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_TENANT_ID ${{ secrets.AZURE_TENANT_ID }}
          azd env set FOUNDRY_PROJECT_ENDPOINT "${{ needs.deploy-ai-foundry.outputs.foundry_endpoint }}"
          azd env set FOUNDRY_MODEL "${{ needs.deploy-ai-foundry.outputs.foundry_model }}"
          azd env set TODO_AGENT_NAME "${{ needs.deploy-ai-foundry.outputs.todo_agent_name }}"
          azd env set TODO_AGENT_VERSION "${{ needs.deploy-ai-foundry.outputs.todo_agent_version }}"
          azd env set AZURE_RESOURCE_MCP_TODO_FQDN "${{ needs.deploy-mcp-server.outputs.mcp_fqdn }}"
          azd provision --no-prompt --no-state
          azd deploy --no-prompt
