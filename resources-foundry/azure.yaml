# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=0.1.0-preview'

name: microsoft-foundry-hosted-todo-agent

metadata:
  template: microsoft-foundry-hosted-todo-agent@1.0.0
  author: Justin Yoo
  description: Provision Microsoft Foundry Hosted Agent using Azure Developer CLI

infra:
  provider: bicep
  path: ./infra

services:
  todo-agent:
    project: src/todo-agent
    host: azure.ai.agent
    language: docker
    docker:
      remoteBuild: false
    kind: hosted
    name: todo-agent
    description: |
      A hosted agent that manages to-do list items.
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi
    deployments:
      - model:
          format: OpenAI
          name: gpt-5-mini
          version: "2025-08-07"
        name: gpt-5-mini
        sku:
          # Thousands of tokens per minute. Each agent turn makes 2-3 model calls that each resend the
          # instructions and tool definitions, so 10 was hit by a single evaluation run (HTTP 429).
          capacity: 100
          name: GlobalStandard
      # Judge model for evaluations. Listed second because the first deployment
      # becomes AZURE_AI_MODEL_DEPLOYMENT_NAME, the agent's own model.
      - model:
          format: OpenAI
          name: gpt-4o
          version: "2024-11-20"
        name: gpt-4o
        sku:
          # 5 evaluators x 28 cases are scored in parallel; at 10 a third of the judge calls got HTTP 429.
          capacity: 50
          name: GlobalStandard
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_RESOURCE_MCP_TODO_FQDN: ${AZURE_RESOURCE_MCP_TODO_FQDN}
      AZURE_KEY_VAULT_ENDPOINT: ${AZURE_KEY_VAULT_ENDPOINT}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    startupCommand: dotnet run

hooks:
  preup:
    posix:
      shell: sh
      run: ./scripts/pre-provision.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/pre-provision.ps1
      interactive: false

  preprovision:
    posix:
      shell: sh
      run: ./scripts/pre-provision.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/pre-provision.ps1
      interactive: false

  postdeploy:
    posix:
      shell: sh
      run: ./scripts/post-deploy.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/post-deploy.ps1
      interactive: false
