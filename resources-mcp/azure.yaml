# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: mcp-todo-server

metadata:
  template: mcp-todo-server@1.0.0
  author: Justin Yoo
  description: Provision MCP To-do server using Azure Developer CLI

services:
  mcp-todo:
    project: ../src/MafStarterPack.McpTodo
    host: containerapp
    language: dotnet
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: false

hooks:
  # azd checks required Bicep inputs (MCP_API_KEY) before preprovision hooks run,
  # so `azd up` needs the key set in preup. preprovision covers a plain `azd provision`
  # once the key has been set by an earlier run.
  preup:
    posix:
      shell: sh
      run: ./scripts/pre-provision.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/pre-provision.ps1
      interactive: false

  preprovision:
    posix:
      shell: sh
      run: ./scripts/pre-provision.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/pre-provision.ps1
      interactive: false

  predeploy:
    posix:
      shell: sh
      run: ./scripts/pre-deploy.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/pre-deploy.ps1
      interactive: false

  postdeploy:
    posix:
      shell: sh
      run: ./scripts/post-deploy.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/post-deploy.ps1
      interactive: false
